name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q HistFlagsKeyboard_Pro_0.3.0.zip -d project

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find project -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HistFlagsKeyboard-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
